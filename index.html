/* ================= PREMIUM THEME ================= */
:root{--serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans',Inter,system-ui,sans-serif;--gold2:#f0cf8a;--shadow:0 1px 2px #0d3a2e0a,0 12px 32px -12px #0d3a2e26;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.17'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>");--pat2:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.10'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>")}
body{font-family:var(--sans);background:#f3f6f4;background-image:var(--pat2);background-size:64px;background-attachment:fixed;-webkit-font-smoothing:antialiased}
.welcome h1,.panelhead h2,.statval,.goalamount,.box h3,.brand strong{font-family:var(--serif)!important;font-weight:700}
.welcome h1{font-size:34px;letter-spacing:-.2px}.panelhead h2{font-size:22px}
.card{border:1px solid #e3ebe7;border-radius:18px;background:#fff}
/* sidebar */
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--deep),color-mix(in srgb,var(--deep) 82%,#000));background-image:var(--pat),linear-gradient(180deg,var(--deep),color-mix(in srgb,var(--deep) 82%,#000));background-size:64px,auto;position:sticky;border-right:1px solid #ffffff10}
.sidebar:after{content:"";position:absolute;inset:0;pointer-events:none}
.brandmark{background:linear-gradient(145deg,#ffffff26,#ffffff0a);border:1px solid #ffffff2a;overflow:hidden}
.brand strong{font-size:21px;letter-spacing:.3px}.brand small{color:var(--gold2);opacity:.85}
.navlabel{color:var(--gold2);opacity:.6}
.nav a{position:relative;font-weight:500;transition:.2s}.nav a.active{background:linear-gradient(90deg,#ffffff22,#ffffff08);color:#fff}
.nav a.active:before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(#f0cf8a,#d9a84e)}
.nav a.active .ico{color:var(--gold2)}
.sidebottom{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:11px 12px;margin:0 2px}
.avatar{background:linear-gradient(145deg,#f0cf8a,#d9a84e);box-shadow:0 0 0 3px #ffffff1c}
/* topbar */
.topbar{position:sticky;top:0;z-index:20;background:#ffffffd9;backdrop-filter:blur(12px);height:68px}
.branch{border-radius:99px;background:#f3f8f5}
.content{padding:30px 40px 56px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px 38px;margin-bottom:20px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;background:linear-gradient(120deg,var(--green) 0%,var(--deep) 100%);box-shadow:0 22px 44px -22px var(--deep)}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:80px;opacity:1;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 85%);mask-image:linear-gradient(100deg,transparent 10%,#000 85%)}
.hero:after{content:"";position:absolute;right:-110px;top:-130px;width:360px;height:360px;border-radius:50%;border:1px solid #f0cf8a40;box-shadow:0 0 0 38px #f0cf8a0c,0 0 0 76px #f0cf8a08}
.hero>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2);font-weight:600}
.eyebrow:before{content:"";width:22px;height:1px;background:var(--gold2)}
.hero h1{font:700 38px/1.1 var(--serif);margin:12px 0 8px;color:#fff}
.hero p{margin:0;color:#c3dcd3;font-size:13px;max-width:520px;line-height:1.6}
.hero .hdate{margin-top:14px;display:inline-block;font-size:12px;color:#e3f0eb;background:#ffffff14;border:1px solid #ffffff22;padding:6px 13px;border-radius:99px}
.hero .hbtn{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.gold{border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:12.5px;color:#3a2a08;background:linear-gradient(135deg,#f6dc9c,#d9a84e);box-shadow:0 8px 18px -8px #d9a84e}
.gold:hover{filter:brightness(1.05)}
.ghost{border:1px solid #ffffff38;border-radius:11px;padding:12px 18px;font-weight:600;font-size:12.5px;color:#fff;background:#ffffff12}
.ghost:hover{background:#ffffff22}
.ring{position:relative;width:158px;height:158px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .rv{text-align:center}.ring .rv b{display:block;font:700 34px var(--serif)}.ring .rv small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#bcd6cc}
/* stats */
.stats{gap:18px;margin-bottom:20px}
.stat{padding:20px 22px;overflow:hidden;min-height:136px;transition:.25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px #0d3a2e40}
.stat:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.stat:after{content:"";position:absolute;right:-26px;bottom:-26px;width:100px;height:100px;background-image:var(--pat);filter:invert(1) hue-rotate(180deg);opacity:.55;background-size:50px}
.staticon{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--mint),#fff);border:1px solid #d7e8e0;color:var(--green)}
.statval{font-size:32px!important;margin:16px 0 4px}
/* chart */
.bars{height:210px;gap:14px}.bar{background:linear-gradient(180deg,#e7bd71,var(--green));border-radius:9px 9px 3px 3px;max-width:50px;transition:.3s}
.bc:hover .bar{filter:brightness(1.15)}.bc:last-child .bar{background:linear-gradient(180deg,#f0cf8a,#d9a84e)}
.bc{color:#6a7f77;font-weight:500}
/* goal */
.goal{background:linear-gradient(145deg,var(--green),var(--deep))!important;box-shadow:0 22px 40px -22px var(--deep)}
.goal>*{position:relative;z-index:1}
.goal .gpat{position:absolute;inset:0;background-image:var(--pat);background-size:70px;z-index:0;opacity:.9;-webkit-mask-image:linear-gradient(200deg,#000,transparent 60%);mask-image:linear-gradient(200deg,#000,transparent 60%)}
.progress span{background:linear-gradient(90deg,#f0cf8a,#d9a84e)}
/* lower grid */
.lower{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr);gap:18px}
.pk{padding:13px 0;border-bottom:1px dashed #e1e9e5}.pk:last-child{border:0}
.pk .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pk b{font-size:13px}.pk small{color:var(--muted);font-size:11px}
.pk .bar2{height:7px}.pk .bar2 span{background:linear-gradient(90deg,var(--green),var(--gold))}
.alert{display:flex;gap:12px;align-items:center;padding:13px 15px;border-radius:13px;background:#fff7e6;border:1px solid #f1dcae;color:#7d5a14;font-size:12px;margin-bottom:16px}
.alert button{margin-left:auto}
.promo{margin-bottom:20px}
.banner{border-radius:18px;border:1px solid #e3ebe7;margin-bottom:20px}
/* tables & forms */
tbody tr{transition:.15s}tbody tr:hover{background:#f6faf8}
th{background:#f7faf8}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
.pad{border-radius:18px}
.primary{background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 8px 18px -8px var(--green)}
.secondary{border-radius:10px}.secondary:hover{background:#f3f8f5}
.welcome{padding-bottom:16px;border-bottom:1px solid #e3ebe7;position:relative}
.welcome:after{content:"";position:absolute;left:0;bottom:-1px;width:70px;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.box{border-radius:20px;box-shadow:0 30px 60px -20px #000a}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--green) 40%,transparent);border-color:var(--green)}
/* login */
#lg{background:linear-gradient(135deg,#0d5b4c,#062e28)!important;background-image:var(--pat),linear-gradient(135deg,#0d5b4c,#062e28)!important;background-size:80px,auto!important}
#lg .box{border-top:4px solid var(--gold);max-width:400px}
@media(max-width:1050px){.hero{padding:28px}.lower{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{height:100vh}.nav a.active:before{left:-8px}.content{padding:20px 14px 48px}.hero{grid-template-columns:1fr;padding:24px 20px}.hero h1{font-size:30px}.ring{display:none}.statval{font-size:25px!important}.sidebottom{padding:8px 0;background:none;border:0}}

.status.late{background:#fdecea;color:#b3261e}.status.late:before{background:#c0392b}
.sisa{font-weight:700;color:#a8631a}.sisa.ok{color:#2f8a67}.pct{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.mini .stat{min-height:98px;padding:16px 18px}.mini .statval{font-size:25px!important;margin:10px 0 2px}
@media(max-width:1050px){.mini{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),KEY='umroh_app_v1',METODE=['Transfer bank','Virtual account','Setor tunai','QRIS'];

A.saveS=async()=>{const o={};['biro','tag','logo','admin','peran','wa','alamat','rek','target','tahun','warna','kode'].forEach(k=>{const v=$('#s_'+k).value;o[k]=['target','tahun'].includes(k)?+v||0:v});if(await run(SB.from('biro').update(o).eq('id',D.s.id)))msg('Pengaturan disimpan')};
A.out=async()=>{await SB.auth.signOut();location.reload()};
const wal=n=>{let d=String(n||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
async function pjLoad(){const el=$('#pj');if(!el)return;const{data,error}=await SB.rpc('owner_list');if(error){el.innerHTML='<div class="card pad"><p class="err">'+esc(error.message)+'</p></div>';return}
const c=k=>data.filter(x=>x.status==k).length;
const st=(a,v)=>`<article class="card stat"><div class="stathead">${a}</div><div class="statval">${v}</div></article>`;
const rows=data.map(x=>`<tr><td><b>${esc(x.biro)}</b><small style="display:block;color:#8a9a94">${esc(x.admin)} · ${esc(x.kode)}</small></td><td>${esc(x.email||'-')}<small style="display:block"><a href="https://wa.me/${wal(x.wa)}" target="_blank" rel="noopener">${esc(x.wa||'-')}</a></small></td><td><span class="status ${x.status=='aktif'?'':'pending'}">${x.status}</span></td><td>${x.status=='menunggu'?'-':fd(x.aktif_sampai)}</td><td>${x.jamaah}</td><td class="amount">${sh(+x.dana)}</td><td><button class="linkbtn" data-act="pj" data-id="${x.id}|tambah|7">+7 hari</button> <button class="linkbtn" data-act="pj" data-id="${x.id}|tambah|30">+30 hari</button> <button class="linkbtn" data-act="pj" data-id="${x.id}|tambah|365">+1 tahun</button> <button class="linkbtn danger" data-act="pj" data-id="${x.id}|nonaktif|0">Nonaktifkan</button></td></tr>`).join('');
el.innerHTML=`<section class="stats">${st('Menunggu verifikasi',c('menunggu'))}${st('Aktif',c('aktif'))}${st('Berakhir',c('berakhir'))}${st('Total biro',data.length)}</section><div class="card pad">${tbl(['Biro','Kontak','Status','Aktif sampai','Jamaah','Dana','Aksi'],rows)}</div>`}
A.pj=async s=>{const[id,aksi,hari]=s.split('|');if(aksi=='nonaktif'&&!confirm('Nonaktifkan biro ini? Data tetap tersimpan, tapi pengguna tidak bisa masuk.'))return;const r=await SB.rpc('owner_atur',{p_biro:id,p_aksi:aksi,p_hari:+hari});if(r.error)return msg(r.error.message);msg(r.data);pjLoad()};
/* ===== Gambar: banner & foto paket (Supabase Storage) ===== */
function shrink(file,maxW){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses gambar')),'image/jpeg',.85)};img.onerror=()=>rej(new Error('File bukan gambar yang valid (pakai JPG atau PNG)'));img.src=u})}
async function upImg(file,maxW,pre){try{const b=await shrink(file,maxW),p=D.s.id+'/'+pre+'-'+Date.now()+'.jpg',r=await SB.storage.from('biro-media').upload(p,b,{contentType:'image/jpeg'});if(r.error){msg(r.error.message);return null}return SB.storage.from('biro-media').getPublicUrl(p).data.publicUrl}catch(x){msg(x.message||'Gagal mengunggah gambar');return null}}
const imgPath=u=>{const i=String(u||'').indexOf('/biro-media/');return i<0?null:decodeURIComponent(u.slice(i+12))};
A.upBanner=async()=>{const f=$('#bn_file').files[0];if(!f)return msg('Pilih gambar dulu');const old=D.s.banner,u=await upImg(f,1600,'banner');if(!u)return;if(await run(SB.from('biro').update({banner:u}).eq('id',D.s.id))){msg('Banner disimpan');const p=imgPath(old);if(p)SB.storage.from('biro-media').remove([p])}};
A.delBanner=async()=>{if(!D.s.banner||!confirm('Hapus banner?'))return;const old=D.s.banner;if(await run(SB.from('biro').update({banner:null}).eq('id',D.s.id))){const p=imgPath(old);if(p)SB.storage.from('biro-media').remove([p])}};
A.upLogo=async()=>{const f=$('#lg_file').files[0];if(!f)return msg('Pilih gambar dulu');const old=D.s.logo,u=await upImg(f,400,'logo');if(!u)return;if(await run(SB.from('biro').update({logo:u}).eq('id',D.s.id))){msg('Logo disimpan');const p=imgPath(old);if(p)SB.storage.from('biro-media').remove([p])}};
A.delLogo=async()=>{const old=D.s.logo;if(!confirm('Hapus logo gambar?'))return;if(await run(SB.from('biro').update({logo:''}).eq('id',D.s.id))){const p=imgPath(old);if(p)SB.storage.from('biro-media').remove([p])}};
function showLogin(m,em,reg,info){const l=$('#lg');l.style.display='flex';
l.innerHTML=`<form class="box" id="lf"><h3>${reg?'Daftar biro baru':'Masuk dashboard'}</h3>${m?`<p class="err">${esc(m)}</p>`:''}${info?`<p class="note" style="background:#eaf5ed;border-radius:8px;padding:10px 12px;margin:0 0 14px">${esc(info)}</p>`:''}${reg?`<label>Nama biro<input name="b" maxlength="80" required></label><label>Nama admin<input name="a" maxlength="60" required></label><label>No. WhatsApp (untuk verifikasi)<input name="w" type="tel" maxlength="20" required></label>`:''}<label>Email<input name="e" type="email" value="${esc(em||'')}" required></label><label>Kata sandi${reg?' (minimal 8 karakter)':''}<input name="p" type="password" ${reg?'minlength="8"':''} required></label><button class="primary" style="width:100%">${reg?'Daftar & coba 7 hari':'Masuk'}</button><p class="note" style="text-align:center;margin:14px 0 0"><a href="#" id="sw">${reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar biro'}</a></p></form>`;
$('#sw').onclick=e=>{e.preventDefault();showLogin('',em,!reg)};
$('#lf').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);
if(reg){const r=await SB.auth.signUp({email:f.get('e'),password:f.get('p'),options:{data:{biro_nama:f.get('b'),admin_nama:f.get('a'),wa:f.get('w')}}});
if(r.error)return showLogin('Gagal daftar: '+r.error.message,f.get('e'),true);
if(r.data.session)await SB.auth.signOut();
return showLogin('',f.get('e'),false,'Pendaftaran diterima. Akun Anda sedang kami verifikasi, lalu diaktifkan dengan masa coba gratis. Kami akan menghubungi Anda lewat WhatsApp.')}
const r=await SB.auth.signInWithPassword({email:f.get('e'),password:f.get('p')});
if(r.error)return showLogin('Gagal masuk: '+r.error.message,f.get('e'));boot()}}
async function boot(){const{data}=await SB.auth.getSession();if(!data.session)return showLogin();if(await load())$('#lg').style.display='none';else showLogin(LERR)}

/* ===== Ringkasan versi premium ===== */
V.home=function(){const s=D.s,T=tot(),td=iso(new Date()),pend=D.t.filter(x=>x.st!='ok'&&!x.void).length,m=months(),mx=Math.max(1,...m.map(x=>x.v)),pc=Math.min(100,T/s.target*100||0),avg=m.slice(-3).reduce((a,x)=>a+x.v,0)/3,last=[...D.t].sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,6),R=66,C=2*Math.PI*R;
const st=(a,i,v,f)=>`<article class="card stat"><div class="stathead">${a}<span class="staticon">${i}</span></div><div class="statval">${v}</div><div class="statfoot">${f}</div></article>`;
const hari=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const pk=D.p.length?D.p.map(p=>{const n=D.j.filter(j=>j.paket==p.id).length,k=p.kuota?Math.min(100,n/p.kuota*100):0;return `<div class="pk"><div class="t"><b>${esc(p.n)}</b><small>${n}/${p.kuota||0} kursi</small></div><div class="bar2"><span style="width:${k}%"></span></div><small style="display:block;margin-top:7px">${rp(p.harga)} · ${esc(fb(p.ber))}</small></div>`}).join(''):'<div class="empty">Belum ada paket.</div>';
return `<section class="hero"><div><span class="eyebrow">Assalamu’alaikum Warahmatullah</span><h1>Selamat datang, ${esc(s.admin.split(' ')[0])}</h1><p>Pantau tabungan jamaah dan perkembangan keberangkatan ${esc(s.biro)} dalam satu tampilan.</p><span class="hdate">${hari}</span><div class="hbtn"><button class="gold" data-act="addT">＋ Catat setoran</button><button class="ghost" data-act="addJ">♙ Tambah jamaah</button></div></div>
<div class="ring"><svg width="158" height="158" viewBox="0 0 158 158"><circle cx="79" cy="79" r="${R}" fill="none" stroke="#ffffff22" stroke-width="9"/><circle cx="79" cy="79" r="${R}" fill="none" stroke="#e7bd71" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/></svg><div class="rv"><b>${pc.toFixed(0)}%</b><small>Target ${s.tahun}</small></div></div></section>
${pend?`<div class="alert"><span>◷</span><span><b>${pend} setoran</b> menunggu konfirmasi Anda.</span><button class="secondary" data-go="setoran">Tinjau</button></div>`:''}
<section class="stats">${st('Total jamaah','♙',D.j.length,'terdaftar')}${st('Dana terkumpul','◈',sh(T),'terkonfirmasi')}${st('Setoran hari ini','⇧',sh(ok().filter(x=>x.tgl==td).reduce((a,x)=>a+x.v,0)),'Dari <b>'+D.t.filter(x=>x.tgl==td&&!x.void).length+' transaksi</b>')}${st('Menunggu konfirmasi','◷',pend,'Perlu ditinjau')}</section>
${s.banner?`<div class="banner" style="background-image:url('${esc(s.banner)}')"></div>`:''}
<section class="dashboard"><article class="card panel"><div class="panelhead"><div><h2>Perkembangan tabungan</h2><p>Dana terkonfirmasi per bulan · 6 bulan terakhir</p></div></div><div class="bars">${m.map(x=>`<div class="bc" title="${rp(x.v)}"><i>${sh(x.v).replace('Rp ','')}</i><div class="bar" style="height:${x.v/mx*75}%"></div>${x.l}</div>`).join('')}</div></article>
<article class="card panel goal"><div class="gpat"></div><div class="panelhead"><div><h2>Target keberangkatan</h2><p>Tahun ${s.tahun}</p></div></div><div class="goalamount">${rp(T)}</div><div class="goalcaption">dari target ${rp(s.target)}</div><div class="progress"><span style="width:${pc}%"></span></div><div class="progressrow"><span>${pc.toFixed(0)}% tercapai</span><span>${D.j.length} jamaah</span></div><div class="goalfoot"><div><small>Kurang</small><b>${sh(Math.max(0,s.target-T))}</b></div><div><small>Rata-rata/bulan</small><b>${sh(avg)}</b></div></div></article></section>
<section class="lower"><article class="card transactions"><div class="panelhead"><div><h2>Setoran terbaru</h2><p>Transaksi tabungan jamaah yang baru masuk</p></div><button class="secondary" data-go="setoran">Lihat semua →</button></div>${tbl(['Jamaah','Tanggal','Metode','Nominal','Status'],last.map(x=>trow(x)).join(''))}</article>
<article class="card panel"><div class="panelhead"><div><h2>Kuota paket</h2><p>Keterisian kursi tiap paket</p></div><button class="secondary" data-go="paket">Kelola</button></div>${pk}</article></section>${sisaCard()}`};


/* ===== Portal jamaah: tautan & bukti ===== */
A.link=id=>{const j=J(id);if(!j)return;const u=new URL('jamaah.html',location.href);u.searchParams.set('t',j.token);
const t='Assalamu’alaikum '+j.n+', berikut tautan pribadi untuk memantau tabungan umroh dan mengirim bukti transfer: '+u.href;
navigator.clipboard?.writeText(u.href);const w=wal(j.hp);if(w){window.open('https://wa.me/'+w+'?text='+encodeURIComponent(t),'_blank')}else msg('Tautan disalin. Nomor HP jamaah belum diisi.')};
A.bukti=async p=>{const w=window.open('','_blank');const r=await SB.storage.from('bukti-tf').createSignedUrl(p,300);if(r.error){w&&w.close();return msg(r.error.message)}if(w)w.location=r.data.signedUrl;else msg('Izinkan pop-up untuk melihat bukti')};


/* ===== Tanggal keberangkatan paket (kalender) ===== */
const fb=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?fd(d):(d||'-');
A.tglP=id=>{const v=P(id)?.ber||'';form('Tanggal keberangkatan',[{k:'ber',l:'Pilih tanggal',t:'date',v:/^\d{4}-\d{2}-\d{2}$/.test(v)?v:'',r:1}],x=>{run(SB.from('paket').update({ber:x.ber}).eq('id',id))})};


/* ===== Sisa pembayaran per jamaah ===== */
let SORT='';
const tglOk=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'');
function jinfo(j){const p=P(j.paket),hg=p?(j.harga??p.harga):0,pd=paid(j.id),sisa=Math.max(0,hg-pd),pc=hg?Math.min(100,pd/hg*100):0,today=new Date();today.setHours(0,0,0,0);
const dep=p&&tglOk(p.ber)?new Date(p.ber+'T00:00'):null,dLeft=dep?Math.round((dep-today)/864e5):null,mLeft=dep?Math.max(0,(dep.getFullYear()-today.getFullYear())*12+dep.getMonth()-today.getMonth()):null,
need=dep&&sisa>0?(mLeft>0?Math.ceil(sisa/mLeft/1000)*1000:sisa):null;
let st=['Belum pilih paket','pending'];if(p){if(hg>0&&sisa==0)st=['Lunas',''];else if(dLeft!==null&&dLeft<0)st=['Terlewat','late'];else if(dLeft!==null&&dLeft<=60)st=['Segera lunasi','late'];else st=['Menabung','pending']}
return{p,hg,pd,sisa,pc,dep,dLeft,mLeft,need,st}}
const hl=i=>i.dep?(i.dLeft<0?'sudah lewat':'H-'+i.dLeft):'';
const urg=i=>i.sisa==0&&i.p?1e9:i.dLeft==null?1e8:i.dLeft;
jrows=function(){const k=q.toLowerCase();let l=D.j.filter(j=>(j.n+j.id).toLowerCase().includes(k)).map(j=>({j,i:jinfo(j)}));
if(SORT=='sisa')l.sort((a,b)=>b.i.sisa-a.i.sisa);else if(SORT=='mendesak')l.sort((a,b)=>urg(a.i)-urg(b.i));
return tbl(['Jamaah','Paket / berangkat','Terkumpul','Sisa','Perlu / bulan','Progres','Status',''],l.map(({j,i})=>`<tr><td><div class="person"><span class="miniava">${esc(ini(j.n))}</span><span><b>${esc(j.n)}</b><small>${esc(j.id)}${j.hp?' · '+esc(j.hp):''}</small></span></div></td>
<td>${esc(i.p?.n||'-')}<small style="display:block;color:#8a9a94;font-size:10px;margin-top:3px">${i.dep?fd(iso(i.dep))+' · '+hl(i):esc(i.p?.ber||'')}</small></td>
<td class="amount">${rp(i.pd)}</td><td class="sisa ${i.p&&i.sisa==0?'ok':''}">${i.p?(i.sisa>0?rp(i.sisa):'Lunas'):'-'}</td><td>${i.need!=null?rp(i.need):'-'}</td>
<td><div class="bar2"><span style="width:${i.pc}%"></span></div><span class="pct">${i.pc.toFixed(0)}%</span></td><td><span class="status ${i.st[1]}">${i.st[0]}</span></td>
<td><button class="linkbtn" data-act="addT" data-id="${j.id}">Setor</button> <button class="linkbtn" data-act="link" data-id="${j.id}">Tautan</button> ${i.sisa>0?`<button class="linkbtn" data-act="ingat" data-id="${j.id}">Ingatkan</button> `:''}<button class="linkbtn danger" data-act="delJ" data-id="${j.id}">Hapus</button></td></tr>`).join(''))};
V.jamaah=function(){const L=D.j.map(jinfo),sis=L.reduce((a,i)=>a+i.sisa,0),lunas=L.filter(i=>i.p&&i.hg>0&&i.sisa==0).length,mep=L.filter(i=>i.sisa>0&&i.dLeft!==null&&i.dLeft<=60).length,rata=L.length?L.reduce((a,i)=>a+i.pc,0)/L.length:0;
const c=(a,v,f)=>`<article class="card stat"><div class="stathead">${a}</div><div class="statval">${v}</div><div class="statfoot">${f}</div></article>`;
return head('Data Jamaah',D.j.length+' jamaah terdaftar','<button class="primary" data-act="addJ">＋ Tambah jamaah</button>')+`<section class="mini">${c('Total sisa tagihan',sh(sis),'belum dibayar seluruh jamaah')}${c('Sudah lunas',lunas,'dari '+D.j.length+' jamaah')}${c('Segera berangkat',mep,'belum lunas, ≤ 60 hari')}${c('Rata-rata progres',rata.toFixed(0)+'%','seluruh jamaah')}</section>
<div class="card pad"><div class="tools"><input id="q" placeholder="Cari nama / nomor…" value="${esc(q)}" oninput="q=this.value;$('#jt').innerHTML=jrows()"><select style="max-width:210px;margin:0" onchange="SORT=this.value;$('#jt').innerHTML=jrows()"><option value="">Urutan: terdaftar</option><option value="mendesak" ${SORT=='mendesak'?'selected':''}>Paling mendesak</option><option value="sisa" ${SORT=='sisa'?'selected':''}>Sisa terbesar</option></select></div><div id="jt">${jrows()}</div></div>`};
function sisaCard(){const l=D.j.map(j=>({j,i:jinfo(j)})).filter(x=>x.i.sisa>0).sort((a,b)=>urg(a.i)-urg(b.i)).slice(0,6);
return `<section class="card transactions" style="margin-top:18px"><div class="panelhead"><div><h2>Sisa pembayaran jamaah</h2><p>Diurutkan dari keberangkatan terdekat</p></div><button class="secondary" data-go="jamaah">Lihat semua →</button></div>${tbl(['Jamaah','Berangkat','Sisa','Perlu / bulan','Status',''],l.map(({j,i})=>`<tr><td><div class="person"><span class="miniava">${esc(ini(j.n))}</span><span><b>${esc(j.n)}</b><small>${esc(i.p?.n||'Belum pilih paket')}</small></span></div></td><td>${i.dep?fd(iso(i.dep))+'<small style="display:block;color:#8a9a94;font-size:10px">'+hl(i)+'</small>':'-'}</td><td class="sisa">${rp(i.sisa)}</td><td>${i.need!=null?rp(i.need):'-'}</td><td><span class="status ${i.st[1]}">${i.st[0]}</span></td><td><button class="linkbtn" data-act="ingat" data-id="${j.id}">Ingatkan</button></td></tr>`).join(''))}</section>`}
A.ingat=id=>{const j=J(id);if(!j)return;const i=jinfo(j),u=new URL('jamaah.html',location.href);u.searchParams.set('t',j.token);
const t='Assalamu’alaikum '+j.n+', sisa pembayaran umroh Anda '+rp(i.sisa)+(i.dep?' dan keberangkatan pada '+fd(iso(i.dep)):'')+'.'+(i.need?' Agar lunas tepat waktu, disarankan menabung sekitar '+rp(i.need)+' per bulan.':'')+' Pantau dan kirim bukti transfer di: '+u.href;
const w=wal(j.hp);if(w)window.open('https://wa.me/'+w+'?text='+encodeURIComponent(t),'_blank');else{navigator.clipboard?.writeText(t);msg('Pesan disalin. Nomor HP jamaah belum diisi.')}};

boot();
