/* ================= PREMIUM THEME ================= */
:root{--serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans',Inter,system-ui,sans-serif;--gold2:#f0cf8a;--shadow:0 1px 2px #0d3a2e0a,0 12px 32px -12px #0d3a2e26;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.17'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>");--pat2:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.10'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>")}
body{font-family:var(--sans);background:#f3f6f4;background-image:var(--pat2);background-size:64px;background-attachment:fixed;-webkit-font-smoothing:antialiased}
.welcome h1,.panelhead h2,.statval,.goalamount,.box h3,.brand strong{font-family:var(--serif)!important;font-weight:700}
.welcome h1{font-size:34px;letter-spacing:-.2px}.panelhead h2{font-size:22px}
.card{border:1px solid #e3ebe7;border-radius:18px;background:#fff}
/* sidebar */
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,var(--deep),color-mix(in srgb,var(--deep) 82%,#000));background-image:var(--pat),linear-gradient(180deg,var(--deep),color-mix(in srgb,var(--deep) 82%,#000));background-size:64px,auto;position:sticky;border-right:1px solid #ffffff10}
.sidebar:after{content:"";position:absolute;inset:0;pointer-events:none}
.brandmark{background:linear-gradient(145deg,#ffffff26,#ffffff0a);border:1px solid #ffffff2a;overflow:hidden}
.brand strong{font-size:21px;letter-spacing:.3px}.brand small{color:var(--gold2);opacity:.85}
.navlabel{color:var(--gold2);opacity:.6}
.nav a{position:relative;font-weight:500;transition:.2s}.nav a.active{background:linear-gradient(90deg,#ffffff22,#ffffff08);color:#fff}
.nav a.active:before{content:"";position:absolute;left:-18px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(#f0cf8a,#d9a84e)}
.nav a.active .ico{color:var(--gold2)}
.sidebottom{background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:11px 12px;margin:0 2px}
.avatar{background:linear-gradient(145deg,#f0cf8a,#d9a84e);box-shadow:0 0 0 3px #ffffff1c}
/* topbar */
.topbar{position:sticky;top:0;z-index:20;background:#ffffffd9;backdrop-filter:blur(12px);height:68px}
.branch{border-radius:99px;background:#f3f8f5}
.content{padding:30px 40px 56px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px 38px;margin-bottom:20px;color:#fff;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;background:linear-gradient(120deg,var(--green) 0%,var(--deep) 100%);box-shadow:0 22px 44px -22px var(--deep)}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:80px;opacity:1;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 85%);mask-image:linear-gradient(100deg,transparent 10%,#000 85%)}
.hero:after{content:"";position:absolute;right:-110px;top:-130px;width:360px;height:360px;border-radius:50%;border:1px solid #f0cf8a40;box-shadow:0 0 0 38px #f0cf8a0c,0 0 0 76px #f0cf8a08}
.hero>*{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold2);font-weight:600}
.eyebrow:before{content:"";width:22px;height:1px;background:var(--gold2)}
.hero h1{font:700 38px/1.1 var(--serif);margin:12px 0 8px;color:#fff}
.hero p{margin:0;color:#c3dcd3;font-size:13px;max-width:520px;line-height:1.6}
.hero .hdate{margin-top:14px;display:inline-block;font-size:12px;color:#e3f0eb;background:#ffffff14;border:1px solid #ffffff22;padding:6px 13px;border-radius:99px}
.hero .hbtn{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.gold{border:0;border-radius:11px;padding:12px 18px;font-weight:700;font-size:12.5px;color:#3a2a08;background:linear-gradient(135deg,#f6dc9c,#d9a84e);box-shadow:0 8px 18px -8px #d9a84e}
.gold:hover{filter:brightness(1.05)}
.ghost{border:1px solid #ffffff38;border-radius:11px;padding:12px 18px;font-weight:600;font-size:12.5px;color:#fff;background:#ffffff12}
.ghost:hover{background:#ffffff22}
.ring{position:relative;width:158px;height:158px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .rv{text-align:center}.ring .rv b{display:block;font:700 34px var(--serif)}.ring .rv small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#bcd6cc}
/* stats */
.stats{gap:18px;margin-bottom:20px}
.stat{padding:20px 22px;overflow:hidden;min-height:136px;transition:.25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 18px 34px -16px #0d3a2e40}
.stat:before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
.stat:after{content:"";position:absolute;right:-26px;bottom:-26px;width:100px;height:100px;background-image:var(--pat);filter:invert(1) hue-rotate(180deg);opacity:.55;background-size:50px}
.staticon{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--mint),#fff);border:1px solid #d7e8e0;color:var(--green)}
.statval{font-size:32px!important;margin:16px 0 4px}
/* chart */
.bars{height:210px;gap:14px}.bar{background:linear-gradient(180deg,#e7bd71,var(--green));border-radius:9px 9px 3px 3px;max-width:50px;transition:.3s}
.bc:hover .bar{filter:brightness(1.15)}.bc:last-child .bar{background:linear-gradient(180deg,#f0cf8a,#d9a84e)}
.bc{color:#6a7f77;font-weight:500}
/* goal */
.goal{background:linear-gradient(145deg,var(--green),var(--deep))!important;box-shadow:0 22px 40px -22px var(--deep)}
.goal>*{position:relative;z-index:1}
.goal .gpat{position:absolute;inset:0;background-image:var(--pat);background-size:70px;z-index:0;opacity:.9;-webkit-mask-image:linear-gradient(200deg,#000,transparent 60%);mask-image:linear-gradient(200deg,#000,transparent 60%)}
.progress span{background:linear-gradient(90deg,#f0cf8a,#d9a84e)}
/* lower grid */
.lower{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr);gap:18px}
.pk{padding:13px 0;border-bottom:1px dashed #e1e9e5}.pk:last-child{border:0}
.pk .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pk b{font-size:13px}.pk small{color:var(--muted);font-size:11px}
.pk .bar2{height:7px}.pk .bar2 span{background:linear-gradient(90deg,var(--green),var(--gold))}
.alert{display:flex;gap:12px;align-items:center;padding:13px 15px;border-radius:13px;background:#fff7e6;border:1px solid #f1dcae;color:#7d5a14;font-size:12px;margin-bottom:16px}
.alert button{margin-left:auto}
.promo{margin-bottom:20px}
.banner{border-radius:18px;border:1px solid #e3ebe7;margin-bottom:20px}
/* tables & forms */
tbody tr{transition:.15s}tbody tr:hover{background:#f6faf8}
th{background:#f7faf8}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
.pad{border-radius:18px}
.primary{background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 8px 18px -8px var(--green)}
.secondary{border-radius:10px}.secondary:hover{background:#f3f8f5}
.welcome{padding-bottom:16px;border-bottom:1px solid #e3ebe7;position:relative}
.welcome:after{content:"";position:absolute;left:0;bottom:-1px;width:70px;height:3px;background:linear-gradient(90deg,var(--gold),transparent)}
.box{border-radius:20px;box-shadow:0 30px 60px -20px #000a}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--green) 40%,transparent);border-color:var(--green)}
/* login */
#lg{background:linear-gradient(135deg,#0d5b4c,#062e28)!important;background-image:var(--pat),linear-gradient(135deg,#0d5b4c,#062e28)!important;background-size:80px,auto!important}
#lg .box{border-top:4px solid var(--gold);max-width:400px}
@media(max-width:1050px){.hero{padding:28px}.lower{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{height:100vh}.nav a.active:before{left:-8px}.content{padding:20px 14px 48px}.hero{grid-template-columns:1fr;padding:24px 20px}.hero h1{font-size:30px}.ring{display:none}.statval{font-size:25px!important}.sidebottom{padding:8px 0;background:none;border:0}}

.status.late{background:#fdecea;color:#b3261e}.status.late:before{background:#c0392b}
.sisa{font-weight:700;color:#a8631a}.sisa.ok{color:#2f8a67}.pct{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.mini .stat{min-height:98px;padding:16px 18px}.mini .statval{font-size:25px!important;margin:10px 0 2px}
@media(max-width:1050px){.mini{grid-template-columns:repeat(2,1fr)}}
.pad{scroll-margin-top:84px}
.dfoto{width:96px;height:128px;border-radius:12px;background:var(--mint);overflow:hidden;display:grid;place-items:center;color:var(--green);font:700 30px var(--serif);flex:none}.dfoto img{width:100%;height:100%;object-fit:cover}
.drow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #e1e9e5;font-size:12px}.drow small{color:var(--muted);flex:none}.drow span{text-align:right;font-weight:600;word-break:break-word}
.box .actions{flex-wrap:wrap;margin-top:14px}
td.no{color:var(--muted);font-size:11px;font-weight:600;width:1%;text-align:right;padding-right:4px;font-variant-numeric:tabular-nums}
th:first-child{border-radius:10px 0 0 10px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed #e1e9e5;font-size:12px;color:var(--muted)}
.pager .pn{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pager button.pgb{min-width:34px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#46645a;font-size:12px;font-weight:600}

<script>
const $=s=>document.querySelector(s),KEY='umroh_app_v1',METODE=['Transfer bank','Virtual account','Setor tunai','QRIS'];

const fd=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});

let tm;const msg=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('show'),8000)};
/* ===== Lapisan data: ganti isi Store ini dengan API/database saat sudah multi-user ===== */
const dm=(k,d)=>{const x=new Date();x.setDate(d);x.setMonth(x.getMonth()-k);return iso(x)};
const demo=()=>({s:{biro:'Nama Biro Anda',tag:'UMROH & HAJI',logo:'✦',admin:'Admin Biro',peran:'Admin biro',wa:'',alamat:'',rek:'',target:1270000000,tahun:2027,warna:'#0d5b4c'},
p:[{id:'p1',n:'Reguler 2027',harga:35000000,kuota:40,ber:'Mar 2027'},{id:'p2',n:'Plus Turki 2027',harga:42000000,kuota:30,ber:'Jun 2027'}],
j:[['Siti Aminah','p1'],['H. Fauzan','p2'],['Rina Nurjanah','p1'],['Maulana Akbar','p1']].map((x,i)=>({id:'UMR-2026-000'+(i+1),n:x[0],hp:'0812000000'+i,paket:x[1]})),
t:[...[5,4,3,2,1,0].flatMap((k,i)=>[{j:'UMR-2026-0001',v:2e6+i*5e5},{j:'UMR-2026-0002',v:5e6},{j:'UMR-2026-0004',v:3e6}].map((x,q)=>({id:'d'+k+q,j:x.j,tgl:dm(k,5+q*6),m:METODE[q],v:x.v,st:'ok'}))),{id:'d9',j:'UMR-2026-0003',tgl:iso(new Date()),m:'Transfer bank',v:1e6,st:'pending'}]});
const Store={load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}},save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){msg('Gagal menyimpan data')}}};
let D={s:{biro:'',tag:'',logo:'',admin:'',peran:'',warna:'#0d5b4c',target:0,tahun:2027},p:[],j:[],t:[]},cur='home',q='',LERR='',IS_OWNER=false;
/* ===== Helper hitung ===== */
const ok=()=>D.t.filter(x=>x.st=='ok'&&!x.void),tot=()=>ok().reduce((a,x)=>a+x.v,0),paid=id=>{if(!_pc||_pc.t!==D.t){_pc={t:D.t,m:{}};ok().forEach(x=>{_pc.m[x.j]=(_pc.m[x.j]||0)+x.v})}return _pc.m[id]||0};let _pc=null;
const J=id=>D.j.find(x=>x.id==id),P=id=>D.p.find(x=>x.id==id),nid=()=>'UMR-'+new Date().getFullYear()+'-'+String(1+Math.max(0,...D.j.map(x=>+x.id.split('-')[2]||0))).padStart(4,'0');
function months(){const r=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=iso(d).slice(0,7);r.push({l:d.toLocaleDateString('id-ID',{month:'short'}),v:ok().filter(x=>x.tgl.startsWith(k)).reduce((a,x)=>a+x.v,0)})}return r}
function dark(h,f){const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(c=>Math.round(c*f).toString(16).padStart(2,'0')).join('')}
function theme(){const s=D.s,r=document.documentElement.style;r.setProperty('--green',s.warna);r.setProperty('--deep',dark(s.warna,.62));document.title=s.biro+' — Dashboard';{const L=s.logo||'';if(/^https?:/.test(L))$('#logo').innerHTML='<img src="'+esc(L)+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:13px">';else $('#logo').textContent=L||ini(s.biro)}$('#bn').textContent=s.biro;$('#bt').textContent=s.tag;$('#av').textContent=ini(s.admin);$('#an').textContent=s.admin;$('#ar').textContent=s.peran;$('#bb').textContent='▣  '+s.biro}

const N1=[['home','▦','Ringkasan'],['jamaah','♙','Data Jamaah'],['setoran','▤','Tabungan'],['paket','✧','Paket Umroh']],N2=[['laporan','▥','Laporan'],['set','⚙','Pengaturan']];
const trow=(x,full)=>`<tr><td><div class="person"><span class="miniava">${esc(ini(J(x.j)?.n||'?'))}</span><span><b>${esc(J(x.j)?.n||'(diarsipkan)')}</b><small>${esc(x.j)}</small></span></div></td><td>${fd(x.tgl)}</td><td>${esc(x.m)}</td><td class="amount">${rp(x.v)}</td><td><span class="status ${x.st=='ok'&&!x.void?'':'pending'}">${x.void?'Dibatalkan':x.st=='ok'?'Terkonfirmasi':'Menunggu'}</span></td>${full?`<td>${x.bukti?`<button class="linkbtn" data-act="bukti" data-id="${esc(x.bukti)}">Bukti</button> `:''}${x.void?'':(x.st!='ok'?`<button class="linkbtn" data-act="ok" data-id="${x.id}">Konfirmasi</button> `:'')+`<button class="linkbtn danger" data-act="delT" data-id="${x.id}">Batalkan</button>`}</td>`:''}</tr>`;
const tbl=(h,rows)=>rows?`<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="empty">Belum ada data.</div>';
const head=(t,p,b='')=>`<section class="welcome"><div><h1>${t}</h1><p>${p}</p></div><div class="actions">${b}</div></section>`;
const V={
home(){const s=D.s,T=tot(),td=iso(new Date()),pend=D.t.filter(x=>x.st!='ok'&&!x.void).length,m=months(),mx=Math.max(1,...m.map(x=>x.v)),pc=Math.min(100,T/s.target*100||0),avg=m.slice(-3).reduce((a,x)=>a+x.v,0)/3,last=[...D.t].sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,5);
const st=(a,i,v,f)=>`<article class="card stat"><div class="stathead">${a}<span class="staticon">${i}</span></div><div class="statval">${v}</div><div class="statfoot">${f}</div></article>`;
return `<section class="welcome"><div><h1>Assalamu’alaikum, ${esc(s.admin.split(' ')[0])} 👋</h1><p>Ringkasan tabungan dan aktivitas ${esc(s.biro)}.</p></div><div class="date">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></section>
${s.banner?`<div class="banner" style="background-image:url('${esc(s.banner)}')"></div>`:''}<section class="stats">${st('Total jamaah','♙',D.j.length,'terdaftar')}${st('Dana terkumpul','◈',sh(T),'terkonfirmasi')}${st('Setoran hari ini','⇧',sh(ok().filter(x=>x.tgl==td).reduce((a,x)=>a+x.v,0)),'Dari <b>'+D.t.filter(x=>x.tgl==td).length+' transaksi</b>')}${st('Menunggu konfirmasi','◷',pend,'Perlu ditinjau')}</section>
<section class="dashboard"><article class="card panel"><div class="panelhead"><div><h2>Perkembangan tabungan</h2><p>Dana terkonfirmasi per bulan (6 bulan terakhir)</p></div></div><div class="bars">${m.map(x=>`<div class="bc" title="${rp(x.v)}"><i>${sh(x.v).replace('Rp ','')}</i><div class="bar" style="height:${x.v/mx*75}%"></div>${x.l}</div>`).join('')}</div></article>
<article class="card panel goal"><div class="panelhead"><div><h2>Target keberangkatan</h2><p>Tahun ${s.tahun}</p></div></div><div class="goalamount">${rp(T)}</div><div class="goalcaption">dari target ${rp(s.target)}</div><div class="progress"><span style="width:${pc}%"></span></div><div class="progressrow"><span>${pc.toFixed(0)}% tercapai</span><span>${D.j.length} jamaah</span></div><div class="goalfoot"><div><small>Kurang</small><b>${sh(Math.max(0,s.target-T))}</b></div><div><small>Rata-rata/bulan</small><b>${sh(avg)}</b></div></div></article></section>
<section class="card transactions"><div class="panelhead"><div><h2>Setoran terbaru</h2><p>Transaksi tabungan jamaah yang baru masuk</p></div><button class="secondary" data-go="setoran">Lihat semua →</button></div>${tbl(['Jamaah','Tanggal','Metode','Nominal','Status'],last.map(x=>trow(x)).join(''))}</section>`},
jamaah(){return head('Data Jamaah',D.j.length+' jamaah terdaftar','<button class="primary" data-act="addJ">＋ Tambah jamaah</button>')+`<div class="card pad"><div class="tools"><input id="q" placeholder="Cari nama / nomor…" value="${esc(q)}" oninput="q=this.value;$('#jt').innerHTML=jrows()"></div><div id="jt">${jrows()}</div></div>`},
setoran(){return head('Tabungan','Seluruh setoran jamaah','<button class="primary" data-act="addT">＋ Catat setoran</button>')+`<div class="card pad">${tbl(['Jamaah','Tanggal','Metode','Nominal','Status',''],[...D.t].sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(x=>trow(x,1)).join(''))}</div>`},
paket(){return head('Paket Umroh','Atur paket dan harga yang ditawarkan','<button class="primary" data-act="addP">＋ Tambah paket</button>')+`<div class="card pad">${tbl(['Foto','Paket','Harga','Berangkat','Kuota','Terisi',''],D.p.map(p=>`<tr><td>${p.foto?`<img class="pimg" src="${esc(p.foto)}" alt="">`:'<span class="note">-</span>'}</td><td><b>${esc(p.n)}</b></td><td class="amount">${rp(p.harga)}</td><td>${esc(fb(p.ber))}</td><td>${p.kuota}</td><td>${D.j.filter(j=>j.paket==p.id).length}</td><td><button class="linkbtn" data-act="editP" data-id="${p.id}">Ubah</button> <button class="linkbtn" data-act="dupP" data-id="${p.id}">Duplikat</button> <button class="linkbtn" data-act="tglP" data-id="${p.id}">Atur tanggal</button> <button class="linkbtn" data-act="fotoP" data-id="${p.id}">${p.foto?'Ganti foto':'Tambah foto'}</button> <button class="linkbtn danger" data-act="delP" data-id="${p.id}">Hapus</button></td></tr>`).join(''))}</div>`},
penjual(){return head('Panel Penjual','Kelola biro yang memakai aplikasi Anda')+'<div id="pj"><div class="empty">Memuat…</div></div>'},
laporan(){const rows=D.p.map(p=>{const js=D.j.filter(j=>j.paket==p.id),tg=js.reduce((a,j)=>a+(j.harga??p.harga),0),tr=js.reduce((a,j)=>a+paid(j.id),0);return `<tr><td><b>${esc(p.n)}</b></td><td>${js.length}</td><td class="amount">${rp(tg)}</td><td class="amount">${rp(tr)}</td><td class="amount">${rp(Math.max(0,tg-tr))}</td></tr>`}).join('');
return head('Laporan','Rekap per paket & ekspor data','<button class="secondary" data-act="csv" data-id="j">⬇ Jamaah (CSV)</button><button class="secondary" data-act="csv" data-id="t">⬇ Setoran (CSV)</button>')+`<div class="card pad">${tbl(['Paket','Jamaah','Total tagihan','Terkumpul','Sisa'],rows)}</div>`},
set(){const s=D.s,F=[['biro','Nama biro'],['tag','Tagline'],['logo','Logo (1–2 huruf/emoji)'],['admin','Nama admin'],['peran','Jabatan'],['wa','No. WhatsApp'],['alamat','Alamat'],['rek','Rekening pembayaran'],['target','Target dana (Rp)','number'],['tahun','Tahun keberangkatan','number'],['warna','Warna utama','color'],['kode','Kode nomor jamaah (3 huruf)']];
return head('Pengaturan','Sesuaikan dashboard dengan identitas biro Anda')+`<div class="card pad"><div class="g2">${F.map(f=>`<label>${f[1]}<input id="s_${f[0]}" type="${f[2]||'text'}" value="${esc(s[f[0]])}"></label>`).join('')}</div><div class="actions"><button class="primary" data-act="saveS">Simpan pengaturan</button></div></div>
<div class="card pad"><div class="panelhead"><div><h2>Logo biro</h2><p class="note">Gambar persegi (disarankan 400×400 px). Menggantikan logo huruf/emoji di pojok kiri atas.</p></div></div>${/^https?:/.test(s.logo||'')?`<img class="pimg" style="width:72px;height:72px;margin-bottom:12px" src="${esc(s.logo)}" alt="">`:''}<label>Pilih gambar<input id="lg_file" type="file" accept="image/*"></label><div class="actions"><button class="primary" data-act="upLogo">Unggah logo</button>${/^https?:/.test(s.logo||'')?'<button class="secondary" data-act="delLogo">Hapus logo</button>':''}</div></div>
<div class="card pad"><div class="panelhead"><div><h2>Banner halaman utama</h2><p class="note">Gambar lebar (disarankan 1600×400 px, JPG/PNG). Otomatis dikecilkan saat diunggah.</p></div></div>${s.banner?`<div class="banner" style="background-image:url('${esc(s.banner)}')"></div>`:'<div class="empty">Belum ada banner.</div>'}<label>Pilih gambar<input id="bn_file" type="file" accept="image/*"></label><div class="actions"><button class="primary" data-act="upBanner">Unggah banner</button>${s.banner?'<button class="secondary" data-act="delBanner">Hapus banner</button>':''}</div></div>
<div class="card pad"><div class="panelhead"><div><h2>Data & akun</h2><p class="note">Data tersimpan aman di server dan terpisah per biro.</p></div></div><div class="actions"><button class="secondary" data-act="bak">⬇ Unduh cadangan</button></div></div>`}};
function jrows(){const k=q.toLowerCase(),l=D.j.filter(j=>(j.n+j.id).toLowerCase().includes(k));return tbl(['Jamaah','HP','Paket','Terkumpul','Sisa','Progres',''],l.map(j=>{const p=P(j.paket),pd=paid(j.id),hg=p?(j.harga??p.harga):0,pc=p?Math.min(100,pd/hg*100):0;return `<tr><td><div class="person"><span class="miniava">${esc(ini(j.n))}</span><span><b>${esc(j.n)}</b><small>${esc(j.id)}</small></span></div></td><td>${esc(j.hp)}</td><td>${esc(p?.n||'-')}</td><td class="amount">${rp(pd)}</td><td>${p?rp(Math.max(0,hg-pd)):'-'}</td><td><div class="bar2"><span style="width:${pc}%"></span></div></td><td><button class="linkbtn" data-act="link" data-id="${j.id}">Tautan</button> <button class="linkbtn" data-act="addT" data-id="${j.id}">Setor</button> <button class="linkbtn danger" data-act="delJ" data-id="${j.id}">Hapus</button></td></tr>`}).join(''))}
function render(){const nv=(a)=>a.map(n=>`<a href="#" data-go="${n[0]}" class="${n[0]==cur?'active':''}"><span class="ico">${n[1]}</span><span>${n[2]}</span></a>`).join('');$('#n1').innerHTML=nv(IS_OWNER?[['penjual','★','Panel Penjual']]:N1);$('#n2').innerHTML=IS_OWNER?'':nv(N2);$('#nl2').style.display=IS_OWNER?'none':'';$('#cr').textContent=[...N1,...N2,['penjual','','Panel Penjual']].find(n=>n[0]==cur)[2];$('#view').innerHTML=V[cur]();theme();if(cur=='penjual')pjLoad()}
const go=v=>{cur=v;render();scrollTo(0,0)};
/* ===== Form & aksi ===== */
function form(title,fs,cb){$('#mo').innerHTML=`<div class="box"><h3>${title}</h3><form id="f">${fs.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t=='number'?'min="0" step="any" required':''} ${f.r?'required':''} ${f.a?`accept="${f.a}"`:''}>`}</label>`).join('')}<div class="actions"><button type="button" class="secondary" data-act="close">Batal</button><button class="primary">Simpan</button></div></form></div>`;$('#mo').classList.add('on');$('#f').onsubmit=e=>{e.preventDefault();cb(Object.fromEntries(new FormData(e.target)));A.close()}}
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));a.download=name;a.click()};
const A={close:()=>$('#mo').classList.remove('on'),
addJ:()=>form('Tambah jamaah',[{k:'n',l:'Nama lengkap',r:1},{k:'hp',l:'No. HP'},{k:'paket',l:'Paket',o:[['','— belum dipilih —'],...D.p.map(p=>[p.id,p.n])]}],v=>{run(SB.from('jamaah').insert({n:v.n,hp:v.hp,paket:v.paket||null})).then(o=>o&&msg('Jamaah ditambahkan'))}),
addT:id=>D.j.length?form('Catat setoran',[{k:'j',l:'Jamaah',v:id,o:D.j.map(j=>[j.id,j.n+' · '+j.id])},{k:'tgl',l:'Tanggal',t:'date',v:iso(new Date()),r:1},{k:'m',l:'Metode',o:METODE.map(m=>[m,m])},{k:'v',l:'Nominal (Rp)',t:'number'},{k:'st',l:'Status',o:[['ok','Terkonfirmasi'],['pending','Menunggu']]}],v=>{run(SB.from('setoran').insert({j:v.j,tgl:v.tgl,m:v.m,v:+v.v,st:v.st})).then(o=>o&&msg('Setoran dicatat'))}):msg('Tambah jamaah dulu'),
addP:()=>form('Tambah paket',[{k:'n',l:'Nama paket',r:1},{k:'harga',l:'Harga (Rp)',t:'number'},{k:'ber',l:'Tanggal keberangkatan',t:'date',r:1},{k:'kuota',l:'Kuota',t:'number'},{k:'foto',l:'Foto paket (opsional)',t:'file',a:'image/*'}],v=>{(async()=>{let foto=null;if(v.foto&&v.foto.size){foto=await upImg(v.foto,1000,'paket');if(!foto)return}await run(SB.from('paket').insert({n:v.n,harga:+v.harga,ber:v.ber,kuota:+v.kuota,foto}));if(!LAST_OK&&foto)dropImg(foto)})()}),
fotoP:id=>form('Foto paket',[{k:'foto',l:'Pilih foto (JPG/PNG)',t:'file',a:'image/*',r:1}],v=>{(async()=>{if(!v.foto||!v.foto.size)return;const old=P(id)?.foto,u=await upImg(v.foto,1000,'paket');if(!u)return;await run(SB.from('paket').update({foto:u}).eq('id',id));settle(u,old)})()}),
ok:id=>run(SB.from('setoran').update({st:'ok'}).eq('id',id)),
delT:id=>confirm('Batalkan setoran ini? Catatan tetap tersimpan sebagai riwayat.')&&run(SB.from('setoran').update({void:true}).eq('id',id)),
delJ:id=>confirm('Arsipkan jamaah ini? Riwayat setoran tetap tersimpan.')&&run(SB.from('jamaah').update({aktif:false}).eq('id',id)),
delP:id=>{if(!confirm('Hapus paket ini?'))return;const p=imgPath(P(id)?.foto);return run(SB.from('paket').delete().eq('id',id)).then(o=>{if(o&&p)SB.storage.from('biro-media').remove([p]);return o})},
saveS:()=>{['biro','tag','logo','admin','peran','wa','alamat','rek','target','tahun','warna','kode'].forEach(k=>{let v=$('#s_'+k).value;D.s[k]=['target','tahun'].includes(k)?+v||0:v});save();render();msg('Pengaturan disimpan')},
csv:k=>{const r=k=='j'?[['ID','Nama','HP','Paket','Terkumpul'],...D.j.map(j=>[j.id,j.n,j.hp,P(j.paket)?.n||'',paid(j.id)])]:[['Tanggal','ID Jamaah','Nama','Metode','Nominal','Status'],...D.t.map(x=>[x.tgl,x.j,J(x.j)?.n||'',x.m,x.v,x.st])];dl(k=='j'?'jamaah.csv':'setoran.csv',r.map(a=>a.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv')},
bak:()=>dl('cadangan-'+iso(new Date())+'.json',JSON.stringify(D),'application/json'),rest:()=>$('#rf').click(),
empty:()=>confirm('Hapus semua jamaah, setoran, dan paket? Pengaturan biro tetap.')&&(D={s:D.s,p:[],j:[],t:[]},save(),render()),

function pager(key,total){const pages=Math.max(1,Math.ceil(total/PS));let p=Math.min(Math.max(1,PG[key]||1),pages);PG[key]=p;
const s=(p-1)*PS,e=Math.min(total,p*PS);if(!total)return{s:0,e:0,html:''};

function cropPhoto(file,w,h){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.max(w/img.width,h/img.height),sw=w/k,sh2=h/k,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,(img.width-sw)/2,(img.height-sh2)/3,sw,sh2,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses foto')),'image/jpeg',.85)};img.onerror=()=>rej(new Error('File bukan gambar yang valid (pakai JPG atau PNG)'));img.src=u})}
