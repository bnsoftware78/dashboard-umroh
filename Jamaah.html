<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tabungan Umroh Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0d5b4c;--deep:#083d35;--gold:#d9a84e;--gold2:#f0cf8a;--mint:#e8f4ef;--ink:#18332e;--muted:#70827d;--line:#e3ebe7;--serif:'Cormorant Garamond',Georgia,serif;--pat:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23d9a84e' stroke-width='1' stroke-opacity='.17'><rect x='13' y='13' width='38' height='38'/><rect x='13' y='13' width='38' height='38' transform='rotate(45 32 32)'/><circle cx='32' cy='32' r='9'/></g></svg>")}
*{box-sizing:border-box}body{margin:0;font:14px 'Plus Jakarta Sans',system-ui,sans-serif;background:#f3f6f4;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}.wrap{max-width:720px;margin:auto;padding:0 16px 60px}
.top{display:flex;align-items:center;gap:11px;padding:16px 0}.logo{width:40px;height:40px;border-radius:13px;background:var(--green);color:var(--gold2);display:grid;place-items:center;font-size:20px;overflow:hidden;flex:none}.logo img{width:100%;height:100%;object-fit:cover}
.top b{font:700 20px var(--serif);display:block}.top small{font-size:10px;letter-spacing:1.3px;color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:26px 22px;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 22px 44px -22px var(--deep);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:80px;-webkit-mask-image:linear-gradient(100deg,transparent 10%,#000 90%);mask-image:linear-gradient(100deg,transparent 10%,#000 90%)}
.hero>*{position:relative}.eb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);font-weight:600}
.hero h1{font:700 30px/1.1 var(--serif);margin:8px 0 6px}.hero p{margin:0;color:#c3dcd3;font-size:12.5px;line-height:1.55}
.chip{display:inline-block;margin-top:12px;font-size:11px;background:#ffffff16;border:1px solid #ffffff2a;border-radius:99px;padding:5px 11px;color:#e6f2ee}
.ring{position:relative;width:132px;height:132px;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:700 32px var(--serif);display:block;text-align:center}.ring small{display:block;text-align:center;font-size:9px;letter-spacing:1px;color:#bcd6cc;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 12px 30px -16px #0d3a2e30}
.card h2{font:700 22px var(--serif);margin:0 0 4px}.card .sub{font-size:11.5px;color:var(--muted);margin:0 0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.k{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px;position:relative;overflow:hidden}
.k:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--gold))}
.k small{display:block;font-size:10.5px;color:var(--muted)}.k b{display:block;font:700 21px var(--serif);margin-top:6px;color:#183c32}
/* perjalanan */
.track{position:relative;display:flex;justify-content:space-between;padding:6px 6px 0;margin:8px 0 4px}
.track:before{content:"";position:absolute;left:22px;right:22px;top:21px;height:4px;border-radius:4px;background:#e3ebe7}
.fill{position:absolute;left:22px;top:21px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--green),var(--gold))}
.st{position:relative;width:52px;text-align:center;font-size:10px;color:var(--muted)}.st i{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 7px;border-radius:50%;background:#fff;border:3px solid #dbe6e1;font-style:normal;font-size:14px}
.st.on{color:var(--green);font-weight:600}.st.on i{border-color:var(--gold);background:var(--gold2)}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:10px;color:#6a7f77}
.bar{width:100%;max-width:42px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#e7bd71,var(--green));min-height:3px}.bc:last-child .bar{background:linear-gradient(180deg,var(--gold2),var(--gold))}.bc i{font-style:normal}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed #e1e9e5;align-items:center}.tl li:last-child{border:0}
.tl .d{width:38px;height:38px;border-radius:12px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none}
.tl b{display:block;font-size:13px}.tl small{color:var(--muted);font-size:11px}.tl .r{margin-left:auto;text-align:right}
.tag{display:inline-block;border-radius:99px;padding:3px 9px;font-size:10px;background:#eaf5ed;color:#37805b;margin-top:4px}.tag.p{background:#fff5e4;color:#a87521}
.rek{display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.5;white-space:pre-line}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:12px}input,select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus{outline:2px solid #0d5b4c55;border-color:var(--green)}
.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green),var(--deep));box-shadow:0 10px 20px -10px var(--green)}
.btn:disabled{opacity:.6}.sec{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:12px;color:#46645a;white-space:nowrap;margin-left:auto}
.wa{display:block;text-align:center;text-decoration:none;color:var(--green);font-weight:600;font-size:12.5px;margin-top:14px}
.empty{text-align:center;color:var(--muted);padding:22px 10px}.err{background:#fdecea;color:#b3261e;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}.ok{background:#eaf5ed;color:#2c7a55;border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
@media(max-width:520px){.hero{grid-template-columns:1fr}.ring{margin:auto;order:-1}.hero h1{font-size:26px}.k b{font-size:17px}.st{width:46px;font-size:9px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Memuat…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),TK=new URLSearchParams(location.search).get('t')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const sh=n=>n>=1e9?'Rp '+(n/1e9).toFixed(2).replace('.',',')+' M':n>=1e6?'Rp '+(n/1e6).toFixed(1).replace('.',',')+' jt':rp(n);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const dark=(h,f)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(c=>Math.round(c*f).toString(16).padStart(2,'0')).join('')};
const wal=n=>{let d=String(n||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return d};
const fb=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')?fd(d):(d||'');
const METODE=['Transfer bank','Virtual account','Setor tunai','QRIS'];
let DATA=null;
function shrink(file,maxW){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('Gagal memproses gambar')),'image/jpeg',.82)};img.onerror=()=>rej(new Error('File harus berupa gambar (JPG/PNG)'));img.src=u})}
async function load(){
  if(!TK){$('#app').innerHTML='<div class="center">Tautan tidak lengkap. Mintalah tautan pribadi Anda kepada admin biro.</div>';return}
  const r=await SB.rpc('jamaah_lihat',{p_token:TK});
  if(r.error||!r.data){$('#app').innerHTML='<div class="center">Tautan tidak valid atau sudah tidak aktif.<br>Silakan hubungi admin biro Anda.</div>';return}
  DATA=r.data;draw()}
function draw(){
  const {biro:b,jamaah:j,setoran:S}=DATA,w=b.warna||'#0d5b4c',r=document.documentElement.style;r.setProperty('--green',w);r.setProperty('--deep',dark(w,.62));document.title='Tabungan '+j.n+' — '+b.biro;
  const okS=S.filter(x=>x.st=='ok'&&!x.void),pend=S.filter(x=>x.st!='ok'&&!x.void),paid=okS.reduce((a,x)=>a+x.v,0),pendSum=pend.reduce((a,x)=>a+x.v,0),harga=+j.harga||0,sisa=Math.max(0,harga-paid),pc=harga?Math.min(100,paid/harga*100):0;
  const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=iso(d).slice(0,7);ms.push({l:d.toLocaleDateString('id-ID',{month:'short'}),v:okS.filter(x=>x.tgl.startsWith(k)).reduce((a,x)=>a+x.v,0)})}
  const mx=Math.max(1,...ms.map(x=>x.v)),avg=ms.slice(-3).reduce((a,x)=>a+x.v,0)/3;
  let est='-';if(sisa==0&&harga)est='Lunas 🎉';else if(avg>0){const n=Math.ceil(sisa/avg),d=new Date();d.setMonth(d.getMonth()+n);est=d.toLocaleDateString('id-ID',{month:'short',year:'numeric'})}
  const R=56,C=2*Math.PI*R,stg=[[0,'🌙','Mulai'],[25,'🌱','25%'],[50,'✨','50%'],[75,'🕌','75%'],[100,'🕋','Lunas']];
  const stp=stg.map(x=>`<div class="st ${pc>=x[0]&&(x[0]>0||paid>0||true)&&pc>=x[0]?'on':''}"><i>${x[1]}</i>${x[2]}</div>`).join('');
  const tl=S.filter(x=>!x.void).slice(0,12).map(x=>`<li><span class="d">${esc(fd(x.tgl).split(' ')[0])}</span><span><b>${rp(x.v)}</b><small>${fd(x.tgl)} · ${esc(x.m)}</small></span><span class="r"><span class="tag ${x.st=='ok'?'':'p'}">${x.st=='ok'?'Terkonfirmasi':'Menunggu konfirmasi'}</span></span></li>`).join('')||'<div class="empty">Belum ada setoran.</div>';
  $('#app').innerHTML=`<div class="top"><div class="logo">${/^https?:/.test(b.logo||'')?`<img src="${esc(b.logo)}" alt="">`:esc(b.logo||String(b.biro||'?')[0])}</div><div><b>${esc(b.biro)}</b><small>${esc(b.tag||'')}</small></div></div>
<section class="hero"><div><div class="eb">Assalamu’alaikum Warahmatullah</div><h1>${esc(j.n)}</h1><p>Semoga Allah mudahkan langkah Anda menuju Baitullah. Berikut perkembangan tabungan umroh Anda.</p><span class="chip">${esc(j.paket||'Paket belum dipilih')}${j.berangkat?' · Berangkat '+esc(fb(j.berangkat)):''}</span></div>
<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="#ffffff22" stroke-width="9"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="#e7bd71" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}"/></svg><div><b>${pc.toFixed(0)}%</b><small>Tercapai</small></div></div></section>
<section class="grid3"><div class="k"><small>Sudah ditabung</small><b>${sh(paid)}</b></div><div class="k"><small>Sisa pelunasan</small><b>${sh(sisa)}</b></div><div class="k"><small>Perkiraan lunas</small><b style="font-size:17px">${est}</b></div></section>
${pend.length?`<div class="ok" style="background:#fff7e6;color:#7d5a14;margin-top:14px">◷ ${pend.length} setoran (${rp(pendSum)}) sedang menunggu konfirmasi admin.</div>`:''}
<section class="card"><h2>Perjalanan menuju Tanah Suci</h2><p class="sub">Dari total biaya paket ${rp(harga)}</p><div class="track"><div class="fill" style="width:calc((100% - 44px)*${pc/100})"></div>${stp}</div></section>
<section class="card"><h2>Tabungan per bulan</h2><p class="sub">Setoran terkonfirmasi, 6 bulan terakhir</p><div class="bars">${ms.map(x=>`<div class="bc"><i>${x.v?sh(x.v).replace('Rp ',''):''}</i><div class="bar" style="height:${x.v/mx*78}%;${x.v?'':'opacity:.25'}"></div>${x.l}</div>`).join('')}</div></section>
<section class="card"><h2>Kirim bukti transfer</h2><p class="sub">Transfer ke rekening berikut, lalu unggah buktinya di bawah.</p>
${b.rek?`<div class="rek"><span id="rk" style="flex:1">${esc(b.rek)}</span><button class="sec" id="cp">Salin</button></div>`:'<div class="empty">Rekening belum diatur oleh biro.</div>'}
<form id="f" style="margin-top:16px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px"><label>Nominal (Rp)<input name="v" type="number" inputmode="numeric" min="1" required></label><label>Tanggal transfer<input name="tgl" type="date" value="${iso(new Date())}" max="${iso(new Date())}" required></label></div><label>Metode<select name="m">${METODE.map(m=>`<option>${m}</option>`).join('')}</select></label><label>Foto bukti transfer<input name="foto" type="file" accept="image/*" required></label><button class="btn" id="sb">Kirim bukti transfer</button><div id="fm"></div></form>
${b.wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${wal(b.wa)}?text=${encodeURIComponent('Assalamu’alaikum, saya '+j.n+' ('+j.id+') ingin bertanya tentang tabungan umroh.')}">Ada pertanyaan? Hubungi admin lewat WhatsApp →</a>`:''}</section>
<section class="card"><h2>Riwayat setoran</h2><p class="sub">Nomor jamaah: ${esc(j.id)}</p><ul class="tl">${tl}</ul></section>`;
  const cp=$('#cp');if(cp)cp.onclick=()=>{navigator.clipboard?.writeText($('#rk').textContent).then(()=>{cp.textContent='Tersalin ✓';setTimeout(()=>cp.textContent='Salin',2000)})};
  $('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),fm=$('#fm'),sb=$('#sb'),file=f.get('foto');sb.disabled=true;sb.textContent='Mengirim…';fm.innerHTML='';
    try{const blob=await shrink(file,1400),path=b.id+'/'+j.id+'-'+Date.now()+'.jpg',u=await SB.storage.from('bukti-tf').upload(path,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;
      const r=await SB.rpc('jamaah_kirim',{p_token:TK,p_v:+f.get('v'),p_tgl:f.get('tgl'),p_m:f.get('m'),p_bukti:path});if(r.error)throw r.error;
      await load();const m=$('#fm');if(m)m.innerHTML='<div class="ok">✓ Jazakumullahu khairan. Bukti transfer terkirim dan menunggu konfirmasi admin.</div>';$('#fm')?.scrollIntoView({behavior:'smooth',block:'center'})}
    catch(x){fm.innerHTML='<div class="err">'+esc(x.message||'Gagal mengirim, coba lagi.')+'</div>';sb.disabled=false;sb.textContent='Kirim bukti transfer'}}}
load();
</script>
</body></html>
